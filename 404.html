<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>xLostPro</title>
    <base href="/" />
	<link rel="icon" type="image/png" href="favicon.png" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --lp-blue: #2563eb; --lp-bg: #fcfcfc; --lp-text: #0f172a; }
        @media (prefers-color-scheme: dark) { :root { --lp-bg: #020617; --lp-text: #f8fafc; } }
        .loader-wrapper { position: fixed; inset: 0; background: var(--lp-bg); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .loader-content { text-align: center; }
        .loader-logo { font-size: 2rem; font-weight: 900; letter-spacing: -0.05em; color: var(--lp-text); text-transform: uppercase; margin-bottom: 1rem; }
        .loader-logo span { color: var(--lp-blue); }
        .loader-bar { width: 150px; height: 2px; background: rgba(0,0,0,0.1); margin: 0 auto; position: relative; overflow: hidden; }
        .loader-progress { position: absolute; left: -100%; width: 100%; height: 100%; background: var(--lp-blue); animation: load 1.5s infinite; }
        @keyframes load { 100% { left: 100%; } }
    </style>
</head>
<body>
<div id="app">
    <div class="loader-wrapper">
        <div class="loader-content">
            <div class="loader-logo">xLost<span>Pro</span></div>
            <div class="loader-bar"><div class="loader-progress"></div></div>
        </div>
    </div>
</div>

<script src="_framework/blazor.webassembly.js"></script>
<script>
    window.downloadFile = (fileName, content) => {
        const blob = new Blob([content], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = fileName; a.click();
        URL.revokeObjectURL(url);
    };

    window.modifyTextAtCursor = (el, openTag, closeTag = "") => {
        const start = el.selectionStart, end = el.selectionEnd, text = el.value;
        el.value = text.substring(0, start) + openTag + text.substring(start, end) + closeTag + text.substring(end);
        el.focus();
        return el.value;
    };

    window.kickSpellcheck = (el) => {
        if (!el) return;
        el.setAttribute('spellcheck', 'false');
        setTimeout(() => el.setAttribute('spellcheck', 'true'), 10);
    };

    window.forceTextCursor = (el) => { if (el) el.style.cursor = 'text'; };

    let escHandler;
    window.setupEscapeKey = (dotNetHelper) => {
        escHandler = (e) => { if (e.key === 'Escape') dotNetHelper.invokeMethodAsync('CloseFullscreen'); };
        window.addEventListener('keydown', escHandler);
    };
    window.cleanupEscapeKey = () => window.removeEventListener('keydown', escHandler);
    // SCROLL UTILITY: Moves the sidebar to a specific Choice ID
    window.scrollToElement = (id) => {
        const el = document.getElementById(id);
        if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            el.style.outline = "2px solid #2563eb";
            setTimeout(() => { el.style.outline = "none"; }, 1000);
        }
    };
    // SPATIAL CALCULUS HELPER: Returns precise element positioning for coordinate normalisation
    window.getElementRect = (el) => {
        const rect = el.getBoundingClientRect();
        return {
            left: rect.left,
            top: rect.top
        };
    };

    // ZENITH-APEX DOM PROBE v1.0.0
    // Scans the current view for specific IDs or classes to ensure markup integrity.
    window.probeMarkupIntegrity = () => {
        const criticalElements = [
            { name: "Flowchart Canvas", selector: ".flowchart-canvas" },
            { name: "Editorial Sidebar", selector: "aside" },
            { name: "Simulation Overlay", selector: ".dm-sim-mode" },
            { name: "Intellisense Registry", selector: "#affinity-intellisense" },
            { name: "Action Row Schema", selector: ".dm-logic-row" },
            { name: "Settings Modal", selector: "h3:contains('Editor Settings')" } // Probes for text content
        ];

        return criticalElements.map(el => {
            const found = document.querySelector(el.selector) !== null;
            return { name: el.name, found: found };
        });
    };

    // Helper for complex text-based probing
    window.probeElementByText = (tagName, text) => {
        const items = document.getElementsByTagName(tagName);
        for (let i = 0; i < items.length; i++) {
            if (items[i].textContent.includes(text)) return true;
        }
        return false;
    };
</script>
</body>
</html>
