                <h1 class="loading-logo">xLost<span>Pro</span></h1>

    <script>
        window.downloadFile = (fileName, content) => {
            const blob = new Blob([content], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = fileName; a.click();
            a.remove(); URL.revokeObjectURL(url);
        }

        window.modifyTextAtCursor = (el, openTag, closeTag = "") => {
            const start = el.selectionStart;
            const end = el.selectionEnd;
            const text = el.value;
            const selectedText = text.substring(start, end);
            const before = text.substring(0, start);
            const after = text.substring(end);

            el.value = before + openTag + selectedText + closeTag + after;
            el.focus();
            el.selectionStart = start + openTag.length;
            el.selectionEnd = start + openTag.length + selectedText.length;
            return el.value;
        };
    </script>

    <script>
        window.setupEscapeKey = (dotNetHelper) => {
            const handler = (e) => {
                if (e.key === 'Escape') {
                    dotNetHelper.invokeMethodAsync('CloseFullscreen');
                    window.removeEventListener('keydown', handler);
                }
            };
            window.addEventListener('keydown', handler);
        };
        window.forceTextCursor = (element) => {
            if (!element) return;
            element.style.cursor = 'text';
            // Small hack: force a style recalculation to make the cursor appear
            const dummy = element.offsetHeight;
        };
        window.kickSpellcheck = (el) => {
            if (!el) return;
            // Toggling the attribute forces the browser's spellcheck engine to re-scan the element
            el.setAttribute('spellcheck', 'false');
            setTimeout(() => {
                el.setAttribute('spellcheck', 'true');
                el.focus();
            }, 10);
        };
    </script>
