<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>xLostPro</title>
    <base href="/" />
	<link rel="icon" type="image/png" href="favicon.png" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --lp-blue: #2563eb; --lp-bg: #fcfcfc; --lp-text: #0f172a; }
        @media (prefers-color-scheme: dark) { :root { --lp-bg: #020617; --lp-text: #f8fafc; } }
        .loader-wrapper { position: fixed; inset: 0; background: var(--lp-bg); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .loader-content { text-align: center; }
        .loader-logo { font-size: 2rem; font-weight: 900; letter-spacing: -0.05em; color: var(--lp-text); text-transform: uppercase; margin-bottom: 1rem; }
        .loader-logo span { color: var(--lp-blue); }
        .loader-bar { width: 150px; height: 2px; background: rgba(0,0,0,0.1); margin: 0 auto; position: relative; overflow: hidden; }
        .loader-progress { position: absolute; left: -100%; width: 100%; height: 100%; background: var(--lp-blue); animation: load 1.5s infinite; }
        @keyframes load { 100% { left: 100%; } }
    </style>
</head>
<body>
<div id="app">
    <div class="loader-wrapper">
        <div class="loader-content">
            <div class="loader-logo">xLost<span>Pro</span></div>
            <div class="loader-bar"><div class="loader-progress"></div></div>
        </div>
    </div>
</div>

<script src="_framework/blazor.webassembly.js"></script>
<script src="js/core-utils.js"></script>
<script src="js/unity-bridge.js"></script>
<script>
    // ZENITH-APEX DOM PROBE v1.3.0
    // Scans the current view for specific IDs or classes to ensure markup integrity.
    // Includes a text-content pass for the Settings Modal.
    window.probeMarkupIntegrity = () => {
        const criticalElements = [
            { name: "Flowchart Canvas", selector: ".flowchart-canvas" },
            { name: "Editorial Sidebar", selector: "aside" },
            { name: "Simulation Overlay", selector: ".dm-sim-mode" },
            { name: "Intellisense Registry", selector: "#affinity-intellisense" },
            { name: "Action Row Schema", selector: ".dm-logic-row" },
            { name: "Unity Engine Host", selector: "#unity-canvas" }
        ];

        // 1. Standard CSS Selector Pass
        const results = criticalElements.map(el => ({
            name: el.name,
            found: document.querySelector(el.selector) !== null
        }));

        // 2. Text-Content Pass for Settings Modal (Special Requirement)
        // Uses the restored 'probeElementByText' utility
        const settingsModalFound = window.probeElementByText("h3", "Editor Settings");
        results.push({ name: "Settings Modal", found: settingsModalFound });

        return results;
    };

    // ESCAPE KEY HUB
    let escHandler;
    window.setupEscapeKey = (dotNetHelper) => {
        escHandler = (e) => { if (e.key === 'Escape') dotNetHelper.invokeMethodAsync('CloseFullscreen'); };
        window.addEventListener('keydown', escHandler);
    };
    window.cleanupEscapeKey = () => window.removeEventListener('keydown', escHandler);
</script>
</body>
</html>
